[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "1.12.0"
description = "A student-focused Model Context Protocol server for Canvas LMS"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Vishal Sachdev", email = "vsachde2@illinois.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
]
keywords = ["canvas", "lms", "mcp", "claude", "education", "api"]
dependencies = [
    "fastmcp>=4,<5",
    "mcp>=2,<3",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.2,<2",
    "pydantic>=2.13.1,<3",
    "python-dateutil>=2.9.0,<3",
    "uvicorn>=0.50.0,<1",
    "pypdf>=5,<7",
    "pypdfium2>=4",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10",
    "xlrd>=2,<3",
    "legacy-doc>=0.2",
    "websockets>=12,<16",
]


[project.urls]
Homepage = "https://github.com/vishalsachdev/canvas-mcp"
Repository = "https://github.com/vishalsachdev/canvas-mcp"
Issues = "https://github.com/vishalsachdev/canvas-mcp/issues"

[project.scripts]
canvas-mcp-server = "canvas_mcp.server:main"

[tool.hatch.version]
path = "src/canvas_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "canvas_mcp/skills"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["archive/"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "TID251",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/canvas_mcp/core/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"canvas_mcp.core.anonymization.anonymize_response_data".msg = "Anonymization is applied once, at the client layer (core/client.py, gated by ENABLE_DATA_ANONYMIZATION). Do not re-anonymize in tool code — see issue #179."

[tool.black]
target-version = ['py311']
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -rs"
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "black>=25.0.0",
    "mypy>=1.15.0,<3",
    "pyyaml>=6.0",
    "xlwt>=1.3,<2",
    "python-pptx>=0.6",
]
